name: Java Security (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "17"

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trivy resolves pom.xml by reading POMs from ~/.m2 first and only then from Maven
      # Central. Without a warm local repository it downloads every BOM remotely and
      # GitHub-hosted runners get "remote Maven repository returned 429 Too Many Requests"
      # (FATAL), so the gate failed on rate limiting instead of on vulnerabilities.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - name: Resolve Maven dependencies into ~/.m2
        run: |
          chmod +x mvnw
          ./mvnw -B -q -ntp dependency:go-offline
      # Pinned by commit SHA: trivy-action tags were hijacked in March 2026, never use @master.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ./.trivyignore
          format: table

  dependency-check:
    name: OWASP dependency check
    runs-on: ubuntu-latest
    # Non-blocking: vulnerabilities surface in the uploaded report and are
    # also covered by Dependabot + Trivy. Manual triage via CODEOWNERS review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B -DskipTests verify -P security
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

  # CodeQL removed - GitHub Advanced Security is required for code scanning on
  # private repositories and is a paid add-on. SpotBugs + FindSecBugs (in the
  # quality profile) provides equivalent static security analysis for free.
