version: 2
updates:
  # Keeps the SHA-pinned actions used by the reusable workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Supply-chain guard: wait a week before adopting a freshly published
    # release (compromised tags are usually detected within days).
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"
